services:
  - type: web
    name: nba-stats-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: PORT
        value: 10000
      - key: BRAVE_API_KEY
        sync: false
      - key: BRAVE_CLIENT_ID
        value: nba-stats-tracker 